name: Daily PR Data Pipeline

on:
  schedule:
    - cron: '17 6 * * *'   # ~06:17 UTC daily; best-effort, GitHub may delay it
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit prs.db back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_REPO: ${{ vars.TARGET_REPO || 'scikit-learn/scikit-learn' }}
        run: python -m src.ingestion.ingest

      - name: Compute metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_REPO: ${{ vars.TARGET_REPO || 'scikit-learn/scikit-learn' }}
        run: python -m src.metrics.compute

      - name: Classify new comments
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          TARGET_REPO: ${{ vars.TARGET_REPO || 'scikit-learn/scikit-learn' }}
        run: python -m src.classifier.classify

      - name: Commit updated database
        run: |
          git config user.name "pr-bottleneck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prs.db
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily data refresh $(date -u +'%Y-%m-%d')"
          git push